[package]
name = "monu_engine"
version = "0.1.0"
edition = "2021"
description = "Игровой движок Monu Engine на базе Bevy"

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_scene",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "bevy_gizmos",
    "bevy_log",
    "multi_threaded",
    "x11",
] }
glam = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
big_space = { workspace = true }

ash = { workspace = true, optional = true }

[features]
default = []
# Экспериментальный низкоуровневый Vulkan-слой поверх Bevy
vulkan_raw = ["dep:ash"]
