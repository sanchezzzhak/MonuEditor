[package]
name = "monu_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
# Подключаем наш движок с включенными гизмо-фичами
monu_engine = { path = "../monu_engine", features = ["editor-gizmos"] }

ash.workspace = true
winit.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true

# UI подключается только сюда
egui.workspace = true
egui_dock.workspace = true
egui-winit.workspace = true
