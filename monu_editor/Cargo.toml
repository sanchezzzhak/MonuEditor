[workspace]
resolver = "3"
members = [
    "monu_engine",
    "monu_editor",
    "monu_game",
]

# Общие версии библиотек для всего проекта
[workspace.dependencies]
ash = "0.38"
winit = "0.30"
glam = "0.29"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"

# UI (используется ТОЛЬКО в monu_editor)
egui = "0.31"
egui_dock = "0.15"
egui-winit = "0.31"

# Профиль для быстрой отладки "бомж-ПК"
[profile.dev.package."*"]
opt-level = 3
