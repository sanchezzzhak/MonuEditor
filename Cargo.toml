[workspace]
resolver = "3"
members = [
    "monu_engine",
    "monu_editor",
    "monu_game",
]

# Общие версии библиотек для всего проекта
[workspace.dependencies]
# Основной фреймворк движка
bevy = { version = "0.19", features = ["dynamic_linking"] }
big_space = "0.13"
# Vulkan (низкоуровневые эксперименты / кастомные рендер-проходы)
ash = "0.38"

glam = "0.29"
parking_lot = "0.12"
#crossbeam-channel = "0.5"
log = "0.4"
#env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json="1.0"
ron = "0.8"

# UI редактора (используется ТОЛЬКО в monu_editor)
# UI редактора (используется ТОЛЬКО в monu_editor)
bevy_egui = "0.42"
egui_dock = "0.21"

# Внутренние crate'ы
monu_engine = { path = "monu_engine" }

# Профиль для быстрой отладки "бомж-ПК"
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
